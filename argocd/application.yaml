apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aegis
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # Update repoURL with your GitHub repository once created
    repoURL: https://github.com/REPLACE_WITH_YOUR_GITHUB_USER/aegis-devops-platform.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: aegis
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
