apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aegis-ingress
  namespace: aegis
  labels:
    app.kubernetes.io/name: aegis-ingress
    app.kubernetes.io/part-of: aegis
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - aegis.local
        - grafana.local
        - prometheus.local
      secretName: aegis-platform-tls
  rules:
    - host: aegis.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aegis-service
                port:
                  number: 80
    - host: grafana.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana-service
                port:
                  number: 3000
    - host: prometheus.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus-service
                port:
                  number: 9090