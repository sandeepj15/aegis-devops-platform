apiVersion: v1
kind: Service
metadata:
  name: aegis-service
  namespace: aegis
  labels:
    app.kubernetes.io/name: aegis-api
    app.kubernetes.io/part-of: aegis
spec:
  type: ClusterIP
  selector:
    app: aegis-api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000